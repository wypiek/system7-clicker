<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System7 Clicker</title>
<meta name="description" content="A retro desktop clicker game. Click the floppy disk, write bytes, buy hardware.">
<meta name="theme-color" content="#a7a7d8">
